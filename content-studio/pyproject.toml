[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-content-studio"
version = "0.1.0"
description = "Local, review-led content production for a one-person studio"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "pydantic>=2.10,<3", "requests>=2.32", "Pillow>=11", "numpy>=2", "imageio-ffmpeg>=0.6", "yt-dlp[default]>=2026.8.19"]

[project.optional-dependencies]
local = ["faster-whisper>=1.2", "opencv-python-headless>=4.10,<5"]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: runs real FFmpeg renders"]

[tool.ruff]
line-length = 105
exclude = ["vendor", "clients", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["studio"]
